version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Waiting a few days lets broken or compromised releases get yanked
    # before they are proposed, which matters because dev updates auto-merge.
    cooldown:
      default-days: 3
    # Dev tooling releases often; one grouped PR keeps the weekly noise down.
    # Majors stay out of the group so breaking changes get their own PR.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
